name: macOS Release Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to package, such as v0.9.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Sign, notarize, and upload arm64 DMG
    runs-on: macos-15
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}

      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt --target aarch64-apple-darwin

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Require an existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true

      - name: Require Apple release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Check Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked --quiet

      - name: Check frontend
        working-directory: frontend
        run: |
          bun run lint
          bun run format:check
          bun run --bun typecheck
          bun run --bun test

      - name: Build signed arm64 app bundle
        working-directory: frontend
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run tauri:build -- --target aarch64-apple-darwin --bundles app

      - name: Verify app signature and architecture
        run: |
          set -eu
          app=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/DevTools.app
          test -d "$app"
          app_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test -n "$app_executable"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -verify_arch arm64 "$app/Contents/MacOS/$app_executable"

      - name: Bundle arm64 DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: "true"
        run: frontend/node_modules/.bin/tauri bundle --config src-tauri/tauri.conf.json --target aarch64-apple-darwin --bundles dmg

      - name: Validate DMG and upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil verify "$dmg"
          xcrun stapler validate "$dmg"
          gh release upload "$RELEASE_TAG" "$dmg" --clobber

      - name: Publish reminder
        run: echo "Verify the draft release and uploaded DMG, then publish the release."
