# pre-commit configuration
# See https://pre-commit.com for more information
#
# Installation:
#   brew install pre-commit  # or: pip install pre-commit
#   pre-commit install --install-hooks -t pre-commit -t pre-push

default_language_version:
  python: python3

repos:
  # ===========================================================================
  # clang-format (C++ code formatting)
  # ===========================================================================
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        name: clang-format (C++)
        types_or: [c++, c]
        files: \.(cpp|h|hpp|c|cc|cxx)$
        exclude: |
          (?x)^(
            build/.*|
            build-.*/.*|
            .*/moc_.*\.cpp|
            .*/ui_.*\.h|
            .*/qrc_.*\.cpp|
            .*/qrcodegen\.(cpp|hpp)
          )$
        args:
          - --style=file

  # ===========================================================================
  # Basic file checks
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: trailing-whitespace
        exclude: ^(.*\.md|.*\.patch|.*/qrcodegen\.(cpp|hpp))$

      - id: end-of-file-fixer
        name: end-of-file-fixer
        exclude: ^(build/|build-.*/|.*/qrcodegen\.(cpp|hpp)$|.*\.svg$|vcpkg\.json$|distribution/Info\.plist\.in$)

      - id: check-added-large-files
        name: check-added-large-files
        args: ['--maxkb=1024']
        exclude: ^(.*\.icns|.*\.png|.*\.qm)$

      - id: check-merge-conflict
        name: check-merge-conflict

  # ===========================================================================
  # Local project hooks
  # ===========================================================================
  - repo: local
    hooks:
      - id: sync-agent-rules
        name: sync-agent-rules
        entry: scripts/sync-agent-rules.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: |
          (?x)^(
            AGENTS\.md|
            \.agents/README\.md|
            \.agents/rules/.*\.md|
            \.claude/rules/.*\.md|
            scripts/sync-agent-rules\.py
          )$

      - id: cmake-build
        name: cmake-build (pre-push)
        entry: bash scripts/pre-push-build.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
