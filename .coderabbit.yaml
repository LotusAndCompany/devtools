# =============================================================================
# CodeRabbit Configuration
# Project: DevTools (C++17 / Qt6 macOS Desktop Application)
# =============================================================================

language: "ja"

tone_instructions: >
  このプロジェクトはmacOS向けC++17/Qt6デスクトップアプリです。
  Qt のメモリ管理（親子関係）とシグナル/スロットパターンを理解した上でレビューしてください。

early_access: false

# =============================================================================
# Reviews
# =============================================================================
reviews:
  profile: "chill"
  request_changes_workflow: false

  # Summary & Display
  high_level_summary: true
  sequence_diagrams: true
  collapse_walkthrough: true
  assess_linked_issues: true
  changed_files_summary: true
  commit_status: true
  review_status: true

  # Disabled features
  poem: false
  auto_title_placeholder: ""
  suggested_reviewers: false
  auto_assign_reviewers: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false

  # ---------------------------------------------------------------------------
  # Path Filters
  # ---------------------------------------------------------------------------
  path_filters:
    # Build artifacts
    - "!build/**"
    - "!build-*/**"
    - "!CMakeFiles/**"

    # Qt auto-generated files (moc, uic, rcc)
    - "!**/moc_*.cpp"
    - "!**/moc_*.h"
    - "!**/ui_*.h"
    - "!**/qrc_*.cpp"

    # Bundled third-party (qrcodegen)
    - "!core/qr_tool/qrcodegen/qrcodegen.cpp"
    - "!core/qr_tool/qrcodegen/qrcodegen.hpp"

    # vcpkg
    - "!vcpkg_installed/**"

    # Binary resources
    - "!res/**/*.png"
    - "!res/**/*.icns"
    - "!res/**/*.qm"

    # macOS distribution assets
    - "!distribution/Assets.xcassets/**"

    # IDE settings
    - "!.qtcreator/**"

  # ---------------------------------------------------------------------------
  # Path Instructions
  # ---------------------------------------------------------------------------
  path_instructions:
    - path: "**/*.{cpp,h,hpp}"
      instructions: >
        C++17 のベストプラクティスに従っているか確認してください。
        命名規則: クラス/構造体/列挙型は PascalCase、関数は camelCase、
        変数/メンバは camelBack、定数/マクロは SCREAMING_SNAKE_CASE、ファイル名は snake_case。
        auto, constexpr, structured bindings, std::optional 等のモダンC++機能の適切な使用を推奨してください。
        フォーマットに関する指摘は不要です（clang-format が CI で強制されています）。

    - path: "core/**/*.{cpp,h,hpp}"
      instructions: >
        core/ はUIに依存しないビジネスロジック層です。
        Qt Widgets への直接依存がないことを確認してください（QtCore, QtSql, QtNetwork は許可）。
        例外処理、エラーハンドリング、スレッドセーフティに注意してください。

    - path: "gui/**/*.{cpp,h,hpp,ui}"
      instructions: >
        gui/ は Qt6 Widgets ベースの UI 層です。以下の観点でレビューしてください:
        - シグナル/スロット接続は新しい構文（&Class::method）を推奨
        - new で生成したウィジェットに親が設定されているか（Qt 親子オーナーシップ）
        - UIスレッドでのブロッキング操作がないか
        - .ui ファイルとの整合性

    - path: "tests/**/*.{cpp,h}"
      instructions: >
        Google Test フレームワークのパターンに従っているか確認してください。
        EXPECT_* vs ASSERT_* の適切な使い分け、テストケースの命名、
        境界値テストやエラーケースが含まれているか確認してください。

    - path: "**/CMakeLists.txt"
      instructions: >
        モダン CMake のベストプラクティスに従っているか確認してください。
        target_link_libraries 等のターゲットベースコマンドを使用し、
        グローバルな include_directories や link_libraries を避けてください。
        PUBLIC/PRIVATE/INTERFACE の適切な使い分けを確認してください。

    - path: "docs/**/*.md"
      instructions: >
        ドキュメントの正確性と明瞭さを確認してください。
        docs/ 直下は英語版、docs/ja/ は日本語版です。
        英語版が更新された場合、対応する日本語版も更新が必要か確認してください。

    - path: "docs/ja/**/*.md"
      instructions: >
        日本語ドキュメントです。対応する英語版（docs/ 直下の同名ファイル）との
        内容整合性を確認してください。

    - path: ".github/workflows/**"
      instructions: >
        GitHub Actions のセキュリティ（secrets の適切な使用、permissions の最小権限）、
        キャッシュ戦略に注意してレビューしてください。

    - path: "res/**/*.ts"
      instructions: >
        Qt Linguist の翻訳ファイルです。
        翻訳の欠落（unfinished タグ）や日英間の翻訳整合性を確認してください。

    - path: "vcpkg.json"
      instructions: >
        依存関係のバージョン指定、不要な依存の追加がないか確認してください。

  # ---------------------------------------------------------------------------
  # Auto Review
  # ---------------------------------------------------------------------------
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  # ---------------------------------------------------------------------------
  # Tools
  # ---------------------------------------------------------------------------
  tools:
    # Enabled: relevant to C++/Qt project
    clang:
      enabled: true
    cppcheck:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true

    # Disabled: not used in this project
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    ruff:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    rubocop:
      enabled: false
    brakeman:
      enabled: false
    golangci-lint:
      enabled: false
    phpstan:
      enabled: false
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    pmd:
      enabled: false
    detekt:
      enabled: false
    swiftlint:
      enabled: false
    clippy:
      enabled: false
    hadolint:
      enabled: false
    tflint:
      enabled: false
    checkov:
      enabled: false
    trivy:
      enabled: false
    trufflehog:
      enabled: false
    circleci:
      enabled: false
    semgrep:
      enabled: false
    opengrep:
      enabled: false
    sqlfluff:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    languagetool:
      enabled: false

# =============================================================================
# Chat
# =============================================================================
chat:
  auto_reply: true

# =============================================================================
# Knowledge Base
# =============================================================================
knowledge_base:
  opt_out: false

  web_search:
    enabled: true

  learnings:
    scope: "auto"

  code_guidelines:
    enabled: true

  issues:
    scope: "auto"

  pull_requests:
    scope: "auto"
