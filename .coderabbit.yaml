language: "ja"

tone_instructions: >
  DevTools is a macOS 15+ Apple Silicon desktop app built with Tauri 2, Rust,
  React, and TypeScript. Review native command validation and error handling,
  data preservation during migration, bridge contract parity, localization,
  accessibility, and release workflow permissions and secrets.

early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  sequence_diagrams: true
  collapse_walkthrough: true
  assess_linked_issues: true
  changed_files_summary: true
  commit_status: true
  review_status: true
  poem: false
  auto_title_placeholder: ""
  suggested_reviewers: false
  auto_assign_reviewers: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  path_filters:
    - "!**/target/**"
    - "!**/node_modules/**"
    - "!frontend/dist/**"
    - "!build/**"
    - "!build-*/**"
    - "!vcpkg_installed/**"
    - "!res/**/*.qm"
    - "!designs/**/*.pen"
  path_instructions:
    - path: "src-tauri/**/*.rs"
      instructions: >
        Review Tauri command input validation, structured errors, persistence
        safety, async behavior, and Rust test coverage. Avoid unnecessary
        unsafe code.
    - path: "frontend/src/**/*.{ts,tsx}"
      instructions: >
        Review the typed Tauri bridge contract, localization, accessibility,
        and feature boundaries. The Tauri bridge is the only native transport.
    - path: ".github/workflows/**"
      instructions: >
        Check least-privilege permissions, pinned actions, secret handling,
        signed and notarized release output, and artifact paths.
    - path: "docs/**/*.md"
      instructions: >
        Check technical accuracy and alignment with the current Tauri-only
        macOS release. Keep an existing Japanese mirror aligned with English.
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
